<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#pwaGrad)" />
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Taka Symbol ৳ -->
  <g filter="url(#shadow)">
    <text
      x="96"
      y="126"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif"
      font-size="94"
      font-weight="800"
      fill="#ffffff"
      text-anchor="middle"
    >৳</text>
  </g>
</svg>
